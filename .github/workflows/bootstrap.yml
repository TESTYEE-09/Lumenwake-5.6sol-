name: Validate Lumenwake source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-lumenwake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Expand complete source when needed
        shell: bash
        run: |
          if [ -d .bootstrap ]; then
            cat .bootstrap/source.part* | base64 --decode > /tmp/lumenwake.zip
            rm -rf /tmp/lumenwake-source
            mkdir -p /tmp/lumenwake-source
            unzip -q /tmp/lumenwake.zip -d /tmp/lumenwake-source
            rsync -a --delete \
              --exclude='.git/' \
              --exclude='.bootstrap/' \
              --exclude='.github/workflows/bootstrap.yml' \
              --exclude='.github/workflows/deploy-pages.yml' \
              /tmp/lumenwake-source/lumenwake/ ./
          fi

      - name: Commit expanded source when needed
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Lumenwake Fireworks game source"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build game
        run: npm run build
        env:
          VITE_STORY_API_URL: ${{ vars.VITE_STORY_API_URL }}
